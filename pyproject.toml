[project]
name = "gco-cancer-extractor"
version = "1.2.0"
description = "Extractor GLOBOCAN 0-19 con subida a Google Drive (refresh_token offline)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "pydrive2>=1.19.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
gco-extract = "gco_extractor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gco_extractor"]
